name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download OCR models (pinned URLs, SHA-256 verified)
        shell: pwsh
        run: ./tools/get-models.ps1

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+') { $v = '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained single file, win-x64)
        shell: pwsh
        run: >
          dotnet publish ScreenCapture.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Package zip
        id: pkg
        shell: pwsh
        run: |
          $name = "ScreenCapture-${{ github.ref_name }}-win-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item publish/ScreenCapture.exe $stage
          Copy-Item publish/models $stage -Recurse
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $stage
          $ort = Join-Path $env:USERPROFILE ".nuget/packages/microsoft.ml.onnxruntime/1.32.0/ThirdPartyNotices.txt"
          if (Test-Path $ort) { Copy-Item $ort (Join-Path $stage "onnxruntime-ThirdPartyNotices.txt") }
          foreach ($f in "ScreenCapture.exe", "models/det.onnx", "models/rec_korean.onnx", "models/korean_dict.txt") {
            if (-not (Test-Path (Join-Path $stage $f))) { throw "missing $f in package" }
          }
          $zip = "$name.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCapture-win-x64
          path: ${{ steps.pkg.outputs.zip }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.zip }}
          generate_release_notes: true
